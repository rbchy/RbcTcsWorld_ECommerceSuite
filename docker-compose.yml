# Two ways to use this file:
#
#   docker compose up -d                          -> PostgreSQL only (daily development: run the backend
#                                                    from Eclipse / "mvn spring-boot:run" and "npm run dev")
#   docker compose --profile app up -d --build    -> the WHOLE application in containers:
#                                                    PostgreSQL + backend (8081) + storefront (http://localhost:5173)
#   docker compose --profile app down             -> stop it (add -v to also delete the database volume)
#
# The backend waits until PostgreSQL is healthy, the storefront until the backend is healthy.
name: rbctcsworld

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ecommerce
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecommerce -d ecommerce"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    profiles: ["app"]
    build: ./backend
    image: rbctcsworld/backend:local
    environment:
      DB_HOST: postgres
      # development values - override them in any shared environment (see SECURITY_BN.md)
      JWT_SECRET: ${JWT_SECRET:-change-this-development-secret-key-which-must-be-long-enough-123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@rbctcsworld.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    ports: ["8081:8081"]
    depends_on:
      postgres:
        condition: service_healthy
    mem_limit: 768m

  frontend:
    profiles: ["app"]
    build: ./frontend
    image: rbctcsworld/frontend:local
    ports: ["5173:80"]
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata: {}

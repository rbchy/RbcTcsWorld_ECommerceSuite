name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit + integration tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Traceability matrix references only tests that exist
        run: python3 docs/qa/check_rtm.py
      - name: mvn verify
        run: |
          set -o pipefail
          mvn -B -f backend/pom.xml verify 2>&1 | tee build.log
      - name: Test totals
        if: always()
        run: .github/scripts/test-totals.sh backend backend/target/surefire-reports
      - name: Code coverage (JaCoCo)
        if: always()
        run: .github/scripts/coverage-summary.sh backend/target/site/jacoco/jacoco.csv
      - name: Show failed tests and build errors as annotations
        if: failure()
        run: |
          .github/scripts/annotate-failures.sh backend/target/surefire-reports
          grep -E "^\[ERROR\]" build.log | grep -v "^\[ERROR\] *$" | head -8 | sed -E 's/%/%25/g; s/^/::error title=Maven::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-reports, path: backend/target/surefire-reports }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-coverage, path: backend/target/site/jacoco }

  mutation-tests:
    name: Mutation testing (PIT)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: PIT - mutate the business logic, re-run the unit tests
        run: |
          set -o pipefail
          mvn -B -f backend/pom.xml -Pmutation -Djacoco.skip=true test-compile \
              org.pitest:pitest-maven:mutationCoverage 2>&1 | tee pit.log
      - name: Mutation score and surviving mutants
        if: always()
        run: .github/scripts/mutation-summary.sh backend/target/pit-reports/mutations.xml 10
      - name: Show build errors as annotations
        if: failure()
        run: grep -E "^\[ERROR\]" pit.log | grep -v "^\[ERROR\] *$" | head -8 | sed -E 's/%/%25/g; s/^/::error title=PIT::/' || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mutation-report, path: backend/target/pit-reports }

  api-automation:
    name: API + DB + BDD + Selenium UI tests (PostgreSQL)
    needs: backend-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and start backend
        run: |
          mvn -B -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/ecommerce-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8081/actuator/health
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build and serve frontend (vite preview on 5173, /api proxied to 8081)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5173/api/products > /dev/null && echo "frontend + proxy OK"
      - name: Run API + DB + BDD + UI tests (headless Chrome, preinstalled on the runner)
        run: >-
          mvn -B -f automation/pom.xml test
          -DbaseUrl=http://localhost:8081 -DuiUrl=http://localhost:5173 -Dheadless=true

      # ---------- k6 performance smoke + flash-sale invariant ----------
      - uses: grafana/setup-k6-action@v1
        if: always()
      - name: k6 smoke (SLO thresholds) and flash-sale (no overselling)
        if: always()
        run: |
          k6 run -q -e DURATION=30s performance/tests/smoke.js
          k6 run -q -e BUYERS=60 -e STOCK=15 performance/tests/flash-sale.js
          # catalog size/latency after the whole suite has filled the catalog (DEF-007 regression)
          k6 run -q -e DURATION=20s performance/tests/catalog.js
      - name: k6 key numbers as annotations
        if: always()
        run: for t in smoke flash-sale catalog; do performance/summary-notice.sh $t; done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports
          path: performance/reports/

      - name: Test totals
        if: always()
        run: .github/scripts/test-totals.sh automation automation/target/surefire-reports
      - name: Backend server errors (500) as annotations
        if: always()
        run: .github/scripts/backend-errors.sh backend.log
      - name: Show failed tests as annotations
        if: failure()
        run: .github/scripts/annotate-failures.sh automation/target/surefire-reports

      # ---------- Allure report ----------
      - name: Restore Allure history from the published report (trend graphs)
        if: always()
        run: |
          H=automation/target/allure-results/history
          mkdir -p $H
          BASE=https://rbchy.github.io/RbcTcsWorld_ECommerceSuite/history
          for f in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl -sf "$BASE/$f" -o "$H/$f" || true
          done
      - name: Generate Allure report
        if: always()
        run: mvn -B -f automation/pom.xml allure:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: automation/target/allure-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-reports
          path: |
            automation/target/surefire-reports
            automation/target/cucumber-report.html
            backend.log
            frontend.log

  jenkinsfile-lint:
    name: Jenkinsfile lint (real Jenkins, declarative validator)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: .github/scripts/lint-jenkinsfile.sh

  docker-e2e:
    name: Whole app in Docker (compose) + smoke tests
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: docker compose --profile app up (build images, wait until every container is healthy)
        run: |
          docker compose --profile app up -d --build --wait --wait-timeout 300
          docker compose --profile app ps
          docker image ls --format '{{.Repository}}:{{.Tag}} {{.Size}}' | grep rbctcsworld \
            | sed 's/^/::notice title=Docker image::/'
      - name: Containers answer through the storefront's nginx
        run: |
          set -e
          curl -fsS http://localhost:5173/healthz
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          # API through the nginx reverse proxy (same origin as the browser uses)
          curl -fsS "http://localhost:5173/api/products?size=1" -D - -o /dev/null | grep -i '^x-total-count'
          # storefront security headers; no nginx version leaked
          h=$(curl -fsSI http://localhost:5173/)
          echo "$h" | grep -qi '^x-frame-options: DENY'
          echo "$h" | grep -qi '^content-security-policy:'
          ! echo "$h" | grep -qiE '^server: nginx/[0-9]'
          # backend container does not run as root
          test "$(docker compose exec -T backend id -u)" != "0"
          echo "::notice title=Docker::storefront, API proxy, security headers and non-root user verified"
      - name: Smoke tests (API, BDD, UI) against the containers
        run: >-
          mvn -B -f automation/pom.xml test -Dgroups=smoke
          -DbaseUrl=http://localhost:8081 -DuiUrl=http://localhost:5173 -Dheadless=true
      - name: Test totals
        if: always()
        run: .github/scripts/test-totals.sh docker-smoke automation/target/surefire-reports
      - name: Failed tests and container logs
        if: failure()
        run: |
          .github/scripts/annotate-failures.sh automation/target/surefire-reports
          docker compose --profile app logs --no-color --tail=80
      - name: Stop and remove containers and the database volume
        if: always()
        run: docker compose --profile app down -v

  security-scan:
    name: Security scan (OWASP ZAP API scan + OSV dependency scan)
    needs: backend-tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }

      # ---------- dependencies with known vulnerabilities (SCA) ----------
      # OSV-Scanner (Google) checks pom.xml and package-lock.json against the OSV vulnerability database.
      # Third-party action pinned to a full commit SHA (v2.3.0): a moved tag cannot change what runs here.
      - name: OSV-Scanner - known vulnerabilities in dependencies
        uses: google/osv-scanner-action/osv-scanner-action@b77c075a1235514558f0eb88dbd31e22c45e0cd2
        continue-on-error: true      # report-only: findings are listed as annotations + artifact below
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --recursive
            ./
      - name: Dependency findings as annotations
        if: always()
        run: security/osv-summary.sh osv-results.json
      - name: Newest patch versions on Maven Central
        if: always()
        run: security/latest-versions.sh

      # ---------- running application (DAST) ----------
      - name: Build and start backend
        run: |
          mvn -B -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/ecommerce-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8081/v3/api-docs -o security/zap/openapi.json
          jq '.paths | keys | length' security/zap/openapi.json
      - name: OWASP ZAP API scan (logged in as a customer)
        run: |
          TOKEN=$(curl -sf -X POST http://localhost:8081/api/auth/register -H 'Content-Type: application/json' \
            -d '{"email":"zap-scanner@security.test","password":"Password1!"}' | jq -r .token)
          chmod -R 777 security/zap
          set +e
          # ZAP adds this header to every request it sends (built-in env variables of the packaged scans)
          docker run --rm --network host -v "$PWD/security/zap:/zap/wrk:rw" \
            -e ZAP_AUTH_HEADER=Authorization -e ZAP_AUTH_HEADER_VALUE="Bearer $TOKEN" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8081/v3/api-docs -f openapi -c zap-rules.tsv -I \
              -r zap-report.html -J zap-report.json
          code=$?
          set -e
          security/zap/summary.sh security/zap/zap-report.json
          # 0 = clean, 2 = warnings only (allowed by -I); 1 = a FAIL rule was hit; 3 = ZAP error
          if [ "$code" -eq 1 ] || [ "$code" -eq 3 ]; then echo "::error title=OWASP ZAP::exit code $code"; exit 1; fi
      - name: Backend server errors (500) as annotations
        if: always()
        run: .github/scripts/backend-errors.sh backend.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            security/zap/zap-report.html
            security/zap/zap-report.json
            osv-results.json
            backend.log

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: [api-automation, mutation-tests]
    if: always() && needs.api-automation.result != 'skipped' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages must be enabled once (Settings > Pages > Source: GitHub Actions); until then this job
    # fails without turning the whole CI run red.
    continue-on-error: true
    concurrency: { group: github-pages, cancel-in-progress: false }   # one deployment at a time
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # one site: Allure (/), JaCoCo coverage (/coverage/), PIT mutation report (/mutation/)
      - uses: actions/download-artifact@v4
        with: { name: allure-report, path: site }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: backend-coverage, path: site/coverage }
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: mutation-report, path: site/mutation }
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4

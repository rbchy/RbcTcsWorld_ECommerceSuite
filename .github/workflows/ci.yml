name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend unit + integration tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn -B -f backend/pom.xml verify
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-reports, path: backend/target/surefire-reports }

  api-automation:
    name: API + DB + BDD + Selenium UI tests (PostgreSQL)
    needs: backend-tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: ecommerce, POSTGRES_USER: ecommerce, POSTGRES_PASSWORD: ecommerce }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ecommerce" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: Build and start backend
        run: |
          mvn -B -f backend/pom.xml -DskipTests package
          nohup java -jar backend/target/ecommerce-backend-1.0.0.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8081/actuator/health && break; sleep 2; done
          curl -sf http://localhost:8081/actuator/health
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build and serve frontend (vite preview on 5173, /api proxied to 8081)
        working-directory: frontend
        run: |
          npm ci
          npm run build
          nohup npx vite preview --port 5173 --strictPort > ../frontend.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:5173 > /dev/null && break; sleep 1; done
          curl -sf http://localhost:5173/api/products > /dev/null && echo "frontend + proxy OK"
      - name: Run API + DB + BDD + UI tests (headless Chrome, preinstalled on the runner)
        run: >-
          mvn -B -f automation/pom.xml test
          -DbaseUrl=http://localhost:8081 -DuiUrl=http://localhost:5173 -Dheadless=true

      # ---------- k6 performance smoke + flash-sale invariant ----------
      - uses: grafana/setup-k6-action@v1
        if: always()
      - name: k6 smoke (SLO thresholds) and flash-sale (no overselling)
        if: always()
        run: |
          k6 run -q -e DURATION=30s performance/tests/smoke.js
          k6 run -q -e BUYERS=60 -e STOCK=15 performance/tests/flash-sale.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k6-reports
          path: performance/reports/

      - name: Show failed tests as annotations
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for f in glob.glob('automation/target/surefire-reports/TEST-*.xml'):
              for tc in ET.parse(f).getroot().iter('testcase'):
                  for kind in ('failure', 'error'):
                      e = tc.find(kind)
                      if e is not None:
                          msg = ' '.join((e.get('message') or e.text or '').split())[:400].replace('%', '%25')
                          print(f"::error title={tc.get('classname', '').split('.')[-1]}.{tc.get('name')}::{msg}")
          PY

      # ---------- Allure report ----------
      - name: Restore Allure history from the published report (trend graphs)
        if: always()
        run: |
          H=automation/target/allure-results/history
          mkdir -p $H
          BASE=https://rbchy.github.io/RbcTcsWorld_ECommerceSuite/history
          for f in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl -sf "$BASE/$f" -o "$H/$f" || true
          done
      - name: Generate Allure report
        if: always()
        run: mvn -B -f automation/pom.xml allure:report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: automation/target/allure-report
      - name: Package report for GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with: { path: automation/target/allure-report }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: automation-reports
          path: |
            automation/target/surefire-reports
            automation/target/cucumber-report.html
            backend.log
            frontend.log

  publish-report:
    name: Publish Allure report to GitHub Pages
    needs: api-automation
    if: always() && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Pages must be enabled once (Settings > Pages > Source: GitHub Actions); until then this job
    # fails without turning the whole CI run red.
    continue-on-error: true
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

name: TMP osv diag
on:
  push:
    branches: [ci/runner-pin-node24]
permissions: { contents: read }
jobs:
  diag:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-24.04, ubuntu-26.04] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: dependency tree (filtered)
        run: |
          mvn -B -q -f automation/pom.xml dependency:tree -Dincludes=org.freemarker,org.mozilla,org.apache.httpcomponents.client5,org.apache.httpcomponents.core5 -DoutputFile=$PWD/tree.txt || true
          sed 's/%/%25/g' tree.txt | tr '\n' '|' | sed 's/^/::notice title=tree ${{ matrix.os }}::/'; echo
      - name: osv-scanner with logs
        run: |
          docker run --rm -v "$PWD:/src" ghcr.io/google/osv-scanner:v2.3.0 scan source -r --verbosity=info --format=json --output=/src/out.json /src/automation 2> err.txt || true
          grep -iv '^$' err.txt | tail -25 | sed 's/%/%25/g' | tr '\n' '|' | sed 's/^/::notice title=log ${{ matrix.os }}::/'; echo
          jq -r '[.results[]?.packages[]?.package.name]|join(", ")' out.json | sed 's/^/::notice title=found ${{ matrix.os }}::/'
          docker --version | sed 's/^/::notice title=docker ${{ matrix.os }}::/'

name: TMP osv diag
on:
  push:
    branches: [ci/runner-pin-node24]
permissions: { contents: read }
jobs:
  diag:
    strategy: { fail-fast: false, matrix: { os: [ubuntu-24.04, ubuntu-26.04] } }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '21', cache: maven }
      - name: dependency tree (filtered)
        run: |
          mvn -B -q -f automation/pom.xml dependency:tree -Dincludes=org.freemarker,org.mozilla,org.apache.httpcomponents.client5,org.apache.httpcomponents.core5 -DoutputFile=$PWD/tree.txt || true
          sed 's/%/%25/g' tree.txt | tr '\n' '|' | sed 's/^/::notice title=tree ${{ matrix.os }}::/'; echo
      - uses: google/osv-scanner-action/osv-scanner-action@b77c075a1235514558f0eb88dbd31e22c45e0cd2
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=osv-results.json
            --recursive
            ./
      - name: osv summary
        if: always()
        run: |
          jq -r '.results[] | "\(.source.path): \(.packages|length) vulnerable"' osv-results.json | tr '\n' '|' | sed 's/^/::notice title=osv ${{ matrix.os }}::/'; echo
          jq -r '[.results[].packages[].package.name]|join(", ")' osv-results.json | sed 's/^/::notice title=pkgs ${{ matrix.os }}::/'
          (ls -la ~/.m2 2>&1; cat ~/.m2/settings.xml 2>&1 | head -5) | tr '\n' '|' | sed 's/^/::notice title=m2 ${{ matrix.os }}::/'; echo

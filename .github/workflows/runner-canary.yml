name: Runner canary

# Runs the whole CI pipeline on the NEXT GitHub runner image before it becomes the default.
# The normal pipeline is pinned to ubuntu-24.04, so an image change (new browser builds, AppArmor rules,
# Docker version) can never turn main red overnight; this canary finds the problems first (see DEF-019).
# A red canary is a task for the next sprint, not a broken build. When it stays green, move the pin.
on:
  schedule:
    - cron: '17 6 * * 1'          # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths: ['.github/workflows/runner-canary.yml']

permissions:
  contents: read
  pages: write                    # requested by the (skipped) publish job of ci.yml; nothing is published
  id-token: write

jobs:
  next-image:
    uses: ./.github/workflows/ci.yml
    with:
      runner: ubuntu-26.04
